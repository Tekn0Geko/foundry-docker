---
secrets:
  config_json:
    file: secrets.json

services:
  foundry:
    image: ghcr.io/felddy/foundryvtt:14
    hostname: foundry
    volumes:
      - type: bind
        source: C:\Users\Caleb Tiffin\foundrydata
        target: /data
    ports:
      - target: 30000
        published: 30000
        protocol: tcp
    secrets:
      - source: config_json
        target: config.json